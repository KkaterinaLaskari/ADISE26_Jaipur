    <input type="button" value="Γέμισμα" onmousedown="colour()">

    <script>
        function colour() {
            for (i=0;i<25;i+=1) {
                document.getElementsByTagName('td')[i].textContent=Math.floor(Math.random()*10)
            }

            for (i=0;i<25;i+=1) {
                if (document.getElementsByTagName('td')[i].textContent>=5)
                    document.getElementsByTagName('td')[i].style.backgroundColor="green"
                else {
                    document.getElementsByTagName('td')[i].style.backgroundColor="red"
                }
            }
        }
    </script>
